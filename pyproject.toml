[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qiskit-learning-lab"
version = "0.1.0"
description = "An independent educational toolkit for learning quantum circuits with Qiskit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Isaac Eng Gian Khor"}]
keywords = ["qiskit", "quantum-computing", "education", "quantum-circuits", "simulation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "qiskit>=1.2,<3.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
notebooks = ["jupyterlab>=4", "matplotlib>=3.8"]
simulation = ["qiskit-aer>=0.15"]

[project.urls]
Repository = "https://github.com/egkhor/qiskit-learning-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
